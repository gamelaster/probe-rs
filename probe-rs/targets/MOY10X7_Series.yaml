name: MOY10X7 Series
variants:
  - name: MOY1027
    cores:
      - name: main
        type: armv8m
        core_access_options: !Arm
          ap: !v1 0
      #- name: bt
      #  type: armv8m
      #  core_access_options: !Arm
      #    ap: !v1 1
    memory_map:
      - !Nvm
        range:
          start: 0x10000000
          end: 0x11000000
        cores:
          - main
        access:
          boot: true
      - !Ram
        range:
          start: 0x01100000
          end: 0x01120000
        cores:
          - main
    flash_algorithms:
      - moy10x7
flash_algorithms:
  - name: moy10x7
    description: moy10x7
    default: true
    instructions: 
    pc_init: 0xf9
    pc_uninit: 0x2e5
    pc_program_page: 0x3f9
    pc_erase_sector: 0x3bd
    data_section_offset: 0x1102da4
    flash_properties:
      address_range:
        start: 0x10000000
        end: 0x11000000
      page_size: 0x10000
      erased_byte_value: 0xff
      program_page_timeout: 10000 # 1000?
      erase_sector_timeout: 30000 # 3000?
      sectors:
        - size: 0x10000
          address: 0x0
    cores:
      - main
